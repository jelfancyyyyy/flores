<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias · Flores Amarillas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#FFFDF6; font-family:'Work Sans', sans-serif; color:#2B2A1E; padding:24px;
  }
  .card{
    max-width:420px; text-align:center; background:#FBF3DC; border:1px solid rgba(43,42,30,0.14);
    border-radius:22px; padding:36px 28px;
  }
  h1{ font-family:'Fraunces', serif; color:#33481F; font-size:1.5rem; margin-bottom:10px; }
  .code{ display:inline-block; margin:14px 0; padding:8px 16px; background:#E8A93A; border-radius:10px; font-weight:600; }
  a.btn{ display:inline-block; margin-top:18px; padding:12px 20px; background:#4B6B3A; color:#fff; border-radius:12px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>¡Gracias por tu pago!</h1>
    <p>Estamos confirmando tu pago con Flow. Puede tardar unos segundos en reflejarse.</p>
    <div class="code" id="codigo">FA-----</div>
    <p>Guarda este código como comprobante de tu pedido.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("codigo");
    if (codigo) document.getElementById("codigo").textContent = codigo;
  </script>
</body>
</html>
